name: Scan fights

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours, off the hour to dodge the rush
  workflow_dispatch:            # and a manual "run it now" button
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

concurrency:
  group: cornerman-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the schedules
        run: python scanner/scan.py

      - name: Commit the feed if it changed
        run: |
          if git diff --quiet -- docs/fights.json; then
            echo "No change in the feed."
            exit 0
          fi
          git config user.name  "cornerman-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fights.json
          git commit -m "Update fight feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # A laptop push can land while this job is running. Concurrency
          # only serialises Actions jobs, so rebase can still conflict on
          # fights.json — abort and scan again instead of retrying a mess.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python scanner/scan.py
            if git diff --quiet -- docs/fights.json; then
              echo "Feed already matches main."
              exit 0
            fi
            git add docs/fights.json
            git commit -m "Update fight feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            sleep 5
          done
          exit 1
