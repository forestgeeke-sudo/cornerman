# The hourly Alert clock dispatches mode=run. Schedule is a best-effort fallback.
name: Fight alerts
on:
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = production; dry-run = preview; test = immediate [Test] copy'
        type: choice
        options: [dry-run, test, run]
        default: dry-run
permissions:
  contents: write
concurrency:
  group: cornerman-write
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NTFY_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure state commits
        run: |
          git config user.name 'cornerman-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Refresh stale schedules from the existing cloud clock
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'run' }}
        run: |
          python scanner/refresh.py
          git add docs/fights.json docs/coverage.json scanner/state/providers.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh schedules before notification pass"
            git push origin HEAD:main
          fi
      # The notifier pushes each reservation BEFORE sending, and each result afterwards.
      # A crash or ambiguous outcome stays pending: ntfy has no idempotency key.
      - name: Digest and due fight alerts
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
          CORNERMAN_DIGEST_TIME: ${{ vars.CORNERMAN_DIGEST_TIME || '09:00' }}
        run: python scanner/notify.py "$MODE" --git-state
