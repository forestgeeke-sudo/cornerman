name: Fight alerts

on:
  schedule:
    - cron: "42 * * * *"        # hourly; the alert windows are wide enough to
                                # absorb GitHub's scheduling drift
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be sent without sending it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cornerman-write
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # Without a topic there is nowhere to push, so don't burn a run.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NTFY_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send any due alerts
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          CORNERMAN_TZ: ${{ vars.CORNERMAN_TZ || 'America/Chicago' }}
          CORNERMAN_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scanner/notify.py

      - name: Remember what was sent
        run: |
          if git diff --quiet -- scanner/state/; then
            echo "Nothing new sent."
            exit 0
          fi
          git config user.name  "cornerman-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner/state/
          git commit -m "Record sent fight alerts"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
