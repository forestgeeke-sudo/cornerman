<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cornerman">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="card">
      <rect x="56" y="40" width="400" height="432" rx="6"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#F2E9DC"/>

  <!-- poster panel -->
  <rect x="56" y="40" width="400" height="432" rx="6" fill="#7B2231"/>

  <g clip-path="url(#card)">
    <!-- halftone shading -->
    <g fill="#5A1622" opacity=".55">
      <circle cx="392" cy="96"  r="46"/>
      <circle cx="440" cy="180" r="34"/>
      <circle cx="360" cy="188" r="20"/>
    </g>
    <!-- rust diagonal band -->
    <path d="M56 352 L456 236 L456 300 L56 416 Z" fill="#C4622D"/>
    <!-- perforated stub edge -->
    <g fill="#F2E9DC">
      <circle cx="56" cy="76"  r="11"/><circle cx="56" cy="128" r="11"/>
      <circle cx="56" cy="180" r="11"/><circle cx="56" cy="232" r="11"/>
      <circle cx="56" cy="284" r="11"/><circle cx="56" cy="336" r="11"/>
      <circle cx="56" cy="388" r="11"/><circle cx="56" cy="440" r="11"/>
    </g>
    <rect width="512" height="512" filter="url(#grain)" opacity=".16"/>
  </g>

  <!-- letterpress C -->
  <text x="262" y="330" font-family="Impact, 'Archivo Narrow', 'Liberation Sans Narrow', sans-serif"
        font-size="290" font-weight="800" text-anchor="middle"
        fill="#F2E9DC" letter-spacing="4">C</text>

  <rect x="56" y="40" width="400" height="432" rx="6" fill="none"
        stroke="#1B2A41" stroke-opacity=".35" stroke-width="3"/>
</svg>
